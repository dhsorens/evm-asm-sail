name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Provision Sail Lean support library
        run: ./scripts/setup.sh

      # The dependency tree (evm-asm + mathlib) is large; cache the whole .lake
      # of the root and of the in-submodule extraction between runs.
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            .lake
            extraction/evm-sail/extractions/lean/src/.lake/build
          key: lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.run_id }}
          restore-keys: |
            lake-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Fetch mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build
